<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Приморськ. Хроніка громади</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="description" content="{{desc}}">
{{canonical}}<meta property="og:type" content="article">
<meta property="og:site_name" content="Приморськ. Хроніка громади">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="{{image}}">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">{{jsonld}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Commissioner:wght@400;600&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  :root { --sand: #f5ecdc; --paper: #fffaf2; --ink: #0f222b; --muted: #5d6a6c; --line: #e4d7bf; --sea: #17799a; --foam: #d6ebf0; --wheat: #e1a43b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --sand: #081a22; --paper: #0f2833; --ink: #e8f0ef; --muted: #93a7ab; --line: #1d3d4a; --sea: #5bb7d6; --foam: #123543; --wheat: #f0bb57; }
  }
  :root[data-theme="dark"] { --sand: #081a22; --paper: #0f2833; --ink: #e8f0ef; --muted: #93a7ab; --line: #1d3d4a; --sea: #5bb7d6; --foam: #123543; --wheat: #f0bb57; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sand); color: var(--ink); font: 16px/1.6 'Commissioner', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 3px solid var(--wheat); outline-offset: 2px; }
  .page { max-width: 820px; margin: 0 auto; background: var(--paper); min-height: 100vh; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px;
    background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar a { font-size: 14px; font-weight: 600; color: var(--sea); text-decoration: none; padding: 6px 0; }
  .hero { display: block; width: 100%; aspect-ratio: 16 / 8; object-fit: cover; background: var(--foam); }
  article { padding: 28px clamp(16px, 5vw, 56px) 48px; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); }
  .src { padding: 3px 10px; border-radius: 999px; background: var(--sand); font-weight: 600; font-size: 13px; }
  h1 { font: 600 clamp(26px, 4vw, 38px)/1.15 'Unbounded', sans-serif; letter-spacing: -.03em; margin: 14px 0 24px; overflow-wrap: anywhere; }
  .article { font-size: 18px; line-height: 1.75; overflow-wrap: anywhere; }
  .article img { display: block; max-width: 100%; height: auto; margin: 22px auto; border-radius: 14px; }
  .article iframe, .article video { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 14px; background: #000; display: block; margin: 22px 0 0; }
  .article .byline { font: 13px var(--mono, ui-monospace, monospace); letter-spacing: .04em; color: var(--muted); margin: 0 0 18px; }
  .article p.caption { font-size: 14px; color: var(--muted); margin: -10px 0 22px; text-align: center; }
  .article ol.notes { font-size: 14px; line-height: 1.55; color: var(--muted); padding-left: 1.2em; }
  .article sup { font-size: .7em; line-height: 0; }
  .article .video-gone { margin: 22px 0; padding: 14px 18px; border-radius: 14px; border: 1px dashed currentColor; opacity: .7; font-size: 15px; }
  .article figure { margin: 22px 0; }
  .article figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .article table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
  .article td, .article th { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
  .article h3, .article h4 { font-family: 'Unbounded', sans-serif; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
  .article blockquote { margin: 20px 0; padding: 4px 0 4px 18px; border-left: 4px solid var(--wheat); color: var(--muted); font-style: italic; }
  .article a { color: var(--sea); }
  .orig-title { margin: -12px 0 24px; font-size: 15px; color: var(--muted); }
  a.src { color: inherit; text-decoration: none; }
  a.src:hover { text-decoration: underline; }
  footer { margin: 0 clamp(16px, 5vw, 56px); padding: 20px 0 48px; border-top: 1px solid var(--line); font-size: 14px; display: flex; flex-wrap: wrap; gap: 12px 24px; }
  footer a { color: var(--sea); font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <nav class="bar" aria-label="Навігація">
    <a href="../">← Вся хроніка Приморська</a>
    {{orig}}
  </nav>
  {{hero}}
  <article>
    <div class="meta"><time datetime="{{date}}">{{date_h}}</time>{{source}}</div>
    <h1>{{title}}</h1>
    {{orig_title}}
    <div class="article">
{{body}}
    </div>
  </article>
  <footer>
    <a href="../#{{id}}">Відкрити в хроніці громади</a>
    {{wayback}}
    <div class="share-row" data-share></div>
    <p class="fix-line">Текст подано так, як його було опубліковано в оригіналі, зі збереженням мови й правопису. Помітили помилку? Виділіть фрагмент у тексті або <button type="button" class="fix-link" onclick="openFix()">запропонуйте правку</button>.</p>
  </footer>
</div>
<script>
// our own copy of a video replaces the YouTube embed, the original stays one click away (same as in the chronicle)
fetch('../videos.json').then(r => r.ok ? r.json() : {}).catch(() => ({})).then(local => {
  document.querySelectorAll('.article iframe[src*="youtube"]').forEach(f => {
    const id = (f.getAttribute('src').match(/embed\/([\w-]{11})/) || [])[1];
    if (!id) return;
    const v = local[id], fig = document.createElement('figure');
    const orig = `<a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Оригінал на YouTube ↗</a>`;
    const rel = u => /^https?:/.test(u) ? u : '../' + u;  // Internet Archive copies are absolute
    fig.innerHTML = v ? `<video controls preload="none" playsinline ${v.poster ? `poster="${rel(v.poster)}"` : ''} src="${rel(v.src)}"></video><figcaption>Копія архіву громади · ${orig}</figcaption>`
                      : `${f.outerHTML}<figcaption>${orig}</figcaption>`;
    f.replaceWith(fig);
  });
});
</script>
<script src="../fix.js" defer></script>
<script src="../share.js" defer></script>
</body>
</html>
